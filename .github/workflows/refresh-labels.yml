name: Refresh label texts (weekly, changed-only)

# The daily job keeps the medicine LISTS current; this one keeps the label
# TEXTS current (EU SmPC sections, US prescribing information). It does not
# re-download the corpus: EMA's EPAR document list (one file, last update per
# product information) names the EU labels that changed, plus a rotating
# sample of ~100 labels is asked directly (PDF Last-Modified) as a cross-check;
# openFDA is asked for the current version of every stored set_id — only what
# changed is re-parsed, everything else stays byte-identical. A drift report
# then compares the whole EU corpus with EMA's list independently of the
# refresh; labels more than 14 days behind EMA, labels of withdrawn medicines
# or an incomplete run turn the run red (GitHub mails the repo owner). The result is committed to main and
# the daily job is dispatched with force_deploy (a push made with the Action's
# own token triggers no workflow), so it validates the labels once more
# against the live release (G5/G7 gates) and deploys — one deploy path.

on:
  schedule:
    - cron: '30 4 * * 1'       # Mondays 04:30 UTC, well before the daily 06:17 refresh
  workflow_dispatch:
    inputs:
      limit:
        description: 'max labels to download per run (EU)'
        default: '200'

concurrency:
  group: refresh-data          # never overlap with the daily job
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 300       # ~1,600 HEAD requests paced for EMA's rate limit + downloads
    permissions:
      contents: write
      actions: write         # to dispatch the daily deploy job at the end
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: EU SmPC — refresh what changed at EMA
        run: |
          set -euo pipefail
          cd frontend
          # 150-minute budget: whatever is not checked by then waits for next week;
          # the job (5 h limit) always gets to validate and commit what it has.
          TIME_BUDGET_MIN=150 CHANGED_ONLY=1 node scripts/smpc/extract-all.mjs "${{ github.event.inputs.limit || '200' }}" 2>&1 | tee /tmp/smpc.log | tail -20

      - name: US labels — refresh what changed at openFDA
        run: |
          set -euo pipefail
          cd frontend
          CHANGED_ONLY=1 node scripts/uspi/extract-all.mjs 2>&1 | tee /tmp/uspi.log | tail -20

      # The same gates the daily job runs — a refreshed label that lost a
      # section, shrank, or went back to an older version stops the commit.
      - name: Validate candidate against the published release
        run: |
          set -euo pipefail
          git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages
          python frontend/scripts/validate-release.py --published-ref origin/gh-pages --report /tmp/validation.json --changes /tmp/changes.md

      # Independent of what the refresh did: is every EU label as new as EMA's?
      - name: Drift report — EU labels vs EMA's document list
        id: drift
        if: always()
        run: |
          set -euo pipefail
          cd frontend
          node scripts/smpc/drift-report.mjs --json /tmp/smpc-drift.json --md /tmp/smpc-drift.md
          cat /tmp/smpc-drift.md >> "$GITHUB_STEP_SUMMARY"

      # How old is the data behind each source after this refresh (EMA document
      # list clock, openFDA label dataset date …)? Report only — the daily job
      # it dispatches below recomputes and commits freshness.json with the deploy.
      - name: Source freshness watchdog
        if: always()
        run: |
          set -euo pipefail
          python frontend/scripts/source-freshness.py --probe --no-fail --json /tmp/freshness.json --md /tmp/freshness.md
          cat /tmp/freshness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive logs, validation report and change list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-refresh-${{ github.run_id }}
          path: |
            /tmp/smpc.log
            /tmp/uspi.log
            /tmp/validation.json
            /tmp/changes.md
            /tmp/smpc-drift.json
            /tmp/smpc-drift.md
            /tmp/freshness.json
            /tmp/freshness.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit refreshed labels
        run: |
          set -euo pipefail
          git add frontend/smpc-data frontend/uspi-data frontend/smpc-index.json frontend/uspi-index.json
          if git diff --cached --quiet; then
            echo "No label changed this week — nothing to commit."
            exit 0
          fi
          git --no-pager diff --cached --stat | tail -5
          git config user.name  'DrugRadar Refresh Bot'
          git config user.email 'bernd.gansbacher@gmail.com'
          n=$(git diff --cached --name-only -- frontend/smpc-data frontend/uspi-data | wc -l | tr -d ' ')
          git commit -q -m "Refresh label texts $(date -u +%F): $n label(s) changed at EMA / openFDA [skip ci]"
          # main moves during a multi-hour run (daily data commit, code pushes);
          # none of those touch label files, so a rebase is conflict-free.
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            echo "push attempt $i failed — retrying"; sleep 30
          done
          gh workflow run refresh-data.yml --ref main -f force_deploy=true
        env:
          GH_TOKEN: ${{ github.token }}

      # After the commit, so what was refreshed is kept either way.
      - name: Fail when EU labels drift from EMA
        if: steps.drift.outputs.problems != '' && steps.drift.outputs.problems != '0'
        run: |
          echo "::error::EU label corpus does not match EMA (${{ steps.drift.outputs.problems }} problem(s)) — see the run summary / smpc-drift.md"
          exit 1
