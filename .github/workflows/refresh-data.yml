name: Refresh EMA data & deploy

# Cloud replacement for the laptop launchd job. Keeps the EU approvals list and
# the "Expected" pipeline (pending CHMP opinions = upcoming EU marketing
# authorisations) current whether or not any Mac is on. US approvals are queried
# live by the app, so they need nothing here. The full-text label corpus
# (SmPC/USPI) is refreshed separately/on-demand, not by this job.

on:
  schedule:
    - cron: '17 6 * * *'      # daily 06:17 UTC — announcements go stale in days
                              # (EMA data still only actually changes ~weekly;
                              # unchanged days publish nothing, see Detect change)
  workflow_dispatch:          # allow manual runs
    inputs:
      force_deploy:           # set by refresh-labels.yml: its bot push cannot trigger this
        description: 'deploy even if the daily snapshots did not change'
        default: 'false'
  push:                       # code or snapshot commits to main deploy too
    branches: [main]          # (the bot's own commits carry [skip ci])

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet openpyxl

      # --- Rebuild the EMA snapshot (approvals + expected pipeline) + CGT -------
      - name: Refresh EMA + CGT data
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" -o /tmp/ema.xlsx \
            "https://www.ema.europa.eu/en/documents/report/medicines-output-medicines-report_en.xlsx"
          test -s /tmp/ema.xlsx
          # EU Union Register (Commission decisions of the last six months): lets a
          # medicine the Commission has already authorised leave the "expected"
          # list before EMA updates its own table. Optional — never fatal.
          curl -fsSL -A "Mozilla/5.0" -o /tmp/newproc.htm \
            "https://ec.europa.eu/health/documents/community-register/html/newproc.htm" \
            || echo "WARN: Union Register unavailable — pending list not cross-checked"
          python frontend/scripts/build-ema-data.py /tmp/ema.xlsx frontend/ema-medicines.json /tmp/newproc.htm
          python frontend/scripts/build-cgt-data.py frontend/cgt-products.json
          # FDA press-release announcements (bridges the openFDA data lag).
          # A feed hiccup must not kill the EMA refresh — keep the old file.
          python frontend/scripts/build-announcements.py frontend/announcements.json \
            || echo "WARN: announcements rebuild failed — keeping existing file"
          # US "Recent Approvals": original NDA/BLA approvals of the last year from
          # Drugs@FDA. The script refuses implausible results; keep the old file then.
          python frontend/scripts/build-us-recent.py frontend/us-recent.json \
            || echo "WARN: US recent-approvals rebuild failed — keeping existing file"

      # --- Source-freshness watchdog ---------------------------------------------
      # "Did the job run?" is not "is the data current?". For every upstream
      # source this records the SOURCE'S OWN watermark (EMA's report date,
      # openFDA's meta.last_updated, the EMA document list's clock …) next to
      # our download time, probes the live sources for their current watermark,
      # and compares with the previous run (HEAD:frontend/freshness.json):
      #   OK / STALE (behind its cadence — warning, still published, the app
      #   shows "data through <date>") / FAILED (watermark moved backwards,
      #   count collapsed, ledger unreadable — stops the job before commit and
      #   deploy, so the previous release stays live).
      - name: Source freshness watchdog
        id: fresh
        run: |
          set -euo pipefail
          python frontend/scripts/source-freshness.py --probe --json frontend/freshness.json --md /tmp/freshness.md
          cat /tmp/freshness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Warn when a source is stale
        if: steps.fresh.outputs.status == 'STALE'
        run: echo "::warning::A regulatory source is behind its usual schedule — see the run summary (Source freshness)"

      # --- Quality gates: the candidate must not regress the published release ---
      # Compares the working tree with the data/ folder of gh-pages (what users
      # see right now). A failing gate stops the job here: nothing is committed
      # and nothing is deployed, so the previous release stays live everywhere.
      - name: Validate candidate against the published release
        run: |
          set -euo pipefail
          git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages
          python frontend/scripts/validate-release.py --published-ref origin/gh-pages --report /tmp/validation.json --changes /tmp/changes.md

      # --- Keep the raw inputs + report of every run for 90 days (auditable) ---
      - name: Archive raw sources and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-inputs-${{ github.run_id }}
          path: |
            /tmp/ema.xlsx
            /tmp/newproc.htm
            /tmp/validation.json
            /tmp/changes.md
            /tmp/freshness.md
            frontend/freshness.json
            frontend/scripts/.sources.json
          if-no-files-found: ignore
          retention-days: 90

      # --- Revert files whose CONTENT is unchanged (key order may differ) ------
      - name: Drop pure-reformatting changes
        run: |
          python - <<'PY'
          import json, subprocess
          def norm(d, f):
              # announcements.json restamps "generated" every run — ignore it,
              # so an unchanged item list never triggers a daily redeploy.
              if f.endswith("announcements.json") and isinstance(d, dict):
                  d = {k: v for k, v in d.items() if k != "generated"}
              # us-recent.json restamps its download ledger every run — only
              # the approvals themselves count as a change.
              if f.endswith("us-recent.json") and isinstance(d, dict):
                  d = d.get("items")
              # freshness.json restamps check times and ages every run — only
              # a moved watermark, a changed status or a changed count counts.
              if f.endswith("freshness.json") and isinstance(d, dict):
                  d = {"status": d.get("status"), "currentThrough": {k: v for k, v in (d.get("currentThrough") or {}).items() if k != "pipelineRun"},
                       "sources": {k: (s.get("status"), s.get("sourceUpdatedAt"), s.get("count")) for k, s in (d.get("sources") or {}).items()}}
              return d
          for f in ["frontend/ema-medicines.json", "frontend/cgt-products.json",
                    "frontend/announcements.json", "frontend/us-recent.json", "frontend/freshness.json"]:
              try:
                  head = subprocess.run(["git", "show", "HEAD:" + f],
                                        capture_output=True, text=True, check=True).stdout
                  same = norm(json.loads(head), f) == norm(json.load(open(f)), f)
              except Exception:
                  same = False           # can't compare -> let git diff decide
              if same:
                  subprocess.run(["git", "checkout", "--", f], check=True)
                  print("unchanged:", f)
              else:
                  print("CHANGED  :", f)
          PY

      - name: Detect change
        id: chk
        run: |
          files="frontend/ema-medicines.json frontend/cgt-products.json frontend/announcements.json frontend/us-recent.json frontend/freshness.json"
          if git diff --quiet -- $files && [ -z "$(git ls-files --others --exclude-standard -- frontend/freshness.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes — nothing to publish."
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"; git --no-pager diff --stat -- $files
          fi

      # --- Commit refreshed source data to main -------------------------------
      - name: Commit refreshed data
        if: steps.chk.outputs.changed == 'true'
        run: |
          git config user.name  'DrugRadar Refresh Bot'
          git config user.email 'bernd.gansbacher@gmail.com'
          git add frontend/ema-medicines.json frontend/cgt-products.json frontend/announcements.json frontend/us-recent.json frontend/freshness.json
          git commit -m "Refresh bundled data $(date -u +%F) [skip ci]"
          git push

      # --- Build + publish to GitHub Pages so the installed app pulls it -------
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_deploy == 'true'
        with:
          node-version: '20'
      - name: Build + deploy to gh-pages
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_deploy == 'true'
        run: |
          set -euo pipefail
          npm install --prefix frontend --no-audit --no-fund
          GH_PAGES=true VITE_BUILD_COMMIT="$GITHUB_SHA" npm run build
          cd frontend/dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='DrugRadar Refresh Bot' -c user.email='bernd.gansbacher@gmail.com' \
              commit -q -m "Deploy $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Keep every published manifest for good -------------------------------
      # gh-pages is force-pushed and run artifacts expire after 90 days, so the
      # manifest of each release (pipeline commit, per-file hashes, source hashes)
      # is committed to main under data-releases/. With the commit it names, any
      # release users ever saw can be rebuilt and checked byte for byte.
      - name: Archive the published release manifest
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_deploy == 'true'
        run: |
          set -euo pipefail
          id=$(python -c "import json; print(json.load(open('frontend/dist/data/release.json'))['id'])")
          mkdir -p data-releases
          cp frontend/dist/data/release.json "data-releases/${id}.json"
          cp /tmp/changes.md "data-releases/${id}.changes.md" 2>/dev/null || true
          # the full source-freshness report of this release (release.json holds the summary)
          cp frontend/freshness.json "data-releases/${id}.freshness.json" 2>/dev/null || true
          git config user.name  'DrugRadar Refresh Bot'
          git config user.email 'bernd.gansbacher@gmail.com'
          git add data-releases
          git commit -q -m "Archive data release ${id} [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
